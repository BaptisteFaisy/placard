# File de merge Mergify — socle CI self-hosted (R630).
#
# Dépôt Placard (Kiroween 2026).
# La file exige les checks CI réels + les gardes concours (ci-budget, kiro).
queue_rules:
  - name: default
    queue_conditions:
      - check-success = ci-budget
      - check-success = kiro
      - check-success = typecheck
      - check-success = lint
      - check-success = test
      - check-success = build
      - check-success = stale-base-guard
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    checks_timeout: 5 min
    merge_method: squash
    update_method: merge
    commit_message_format:
      title: pr-title
      body: pr-body

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  max_parallel_checks: 4

pull_request_rules:
  - name: file automatique des PR prêtes
    conditions:
      - check-success = ci-budget
      - check-success = kiro
      - check-success = stale-base-guard
      - -closed
      - -draft
      - -conflict
      - -label = hold
      - base = main
    actions:
      queue:

merge_protections_settings:
  auto_merge_conditions: true
