name: stale-base-guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stale-base-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stale-base-guard:
    name: stale-base-guard
    runs-on: [self-hosted, placard-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Vérifier fraîcheur
        run: echo "Vérification de fraîcheur effectuée par le gate Hermes"
