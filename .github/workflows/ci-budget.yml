name: ci-budget

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-budget:
    name: ci-budget
    runs-on: [self-hosted, placard-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Vérifier timeouts (<= 5 min)
        run: python3 .github/ci-budget/check_timeouts.py
