name: kiro-guard

# Contrôle de conformité Kiroween 2026 :
# 1. Dossier /.kiro suivi à la racine et absent du .gitignore
# 2. Licence MIT, journal Kiro présent
# 3. Auto-scan du dépôt par son propre moteur : 0 trouvaille ouverte
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kiro-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kiro:
    name: kiro
    runs-on: [self-hosted, placard-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
      - name: Contrôle de conformité Kiroween
        run: python3 .github/kiro/check_kiro.py
      - uses: ./.github/actions/setup
      - name: Auto-scan du dépôt (--fail-on-open)
        run: pnpm exec tsx --tsconfig tsconfig.node.json packages/cli/src/main.ts scan . --fail-on-open
